openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
servers:
  - url: https://{env}.example.com/v1
    variables:
      env:
        default: api
security:
  - bearerAuth: []
paths:
  /pets:
    get:
      summary: List pets
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [available, sold]
        - name: X-Request-Id
          in: header
          required: true
          example: abc-123
    post:
      operationId: createPet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
    get:
      security: []
      responses: {}
    delete:
      summary: Delete a pet
      security:
        - apiKey: []
  /login:
    post:
      summary: Login
      security:
        - basic: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  example: alice
                password:
                  type: string
                  format: password
components:
  parameters:
    Limit:
      name: limit
      in: query
      required: true
      schema:
        type: integer
        default: 20
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    basic:
      type: http
      scheme: basic
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Pet:
      type: object
      required: [name]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          example: Rex
        tag:
          type: string
        born:
          type: string
          format: date
        owner:
          $ref: '#/components/schemas/Owner'
        friends:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
    Owner:
      allOf:
        - type: object
          properties:
            email:
              type: string
              format: email
        - type: object
          properties:
            vip:
              type: boolean
